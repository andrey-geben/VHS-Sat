<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="theme-color" content="#0e1418">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='watch.css') }}">
</head>
<body class="viewer-body">
  {% block content %}{% endblock %}
  <footer class="viewer-foot muted small">
    VHS-Sat · viewer · порт {{ viewer_port }} ·
    <a href="/about" style="color:#4aa3e0">О программе</a> ·
    {% if playlist_public %}<a href="/playlist.m3u" style="color:#4aa3e0">📻 плейлист</a>{% endif %}
  </footer>
</body>
</html>
